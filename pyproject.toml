[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afcl"
version = "0.1.0"
description = "Reconciles Agentforce action schemas against the invocable Apex or Flow behind them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Chunduru", email = "hello.manojchunduru@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]
evidence = [
  "playwright>=1.45",
  "cmarkgfm>=2024.1",
  "pillow>=10",
]

[project.scripts]
afcl = "afcl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["afcl"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
